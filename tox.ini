[tox]
basepython = python3.12
envlist =
    check,
    py313  # EOL 2029-10-31 
    py312  # EOL 2028-10-31 
    py311  # EOL 2027-10-31
    py310  # EOL 2026-10-04
    py39  # EOL 2025-10-05
    py38  # EOL 2024-10-14
    ; py37  # EOL 2023-06-27
    ; py36  # EOL 2021-12-21
    coverage
skip_missing_interpreters = true


# TOX Test Environment
[testenv]
usedevelop = True
setenv =
    COVERAGE_FILE = build/coverage/.coverage.{envname}
deps =
    PyYAML
    pytest
    pytest-cov
    pytest-html
    # requests
    semantic_version
    snazzy
    toml
commands =
    # Run everything from /tests folder:
    python -V
    ; pip list
    pytest -ra -v -x --durations=10 --cov=yabs --cov-report=xml --html=build/pytest/report-{envname}.html --self-contained-html {posargs}


[testenv:coverage]
skip_install = true
deps =
    coverage
setenv =
    COVERAGE_FILE = build/coverage/.coverage
commands =
    coverage erase
    coverage combine --data-file build/coverage/.coverage
    coverage html -d build/coverage_html
    # coverage xml
    coverage report --fail-under=30.0


[testenv:lint]
skip_install = true
deps =
    ruff
    ; {[testenv:pyright]deps}
    # {[testenv:mypy]deps}
commands =
    ruff -V
    ruff check yabs tests
    ruff format --check yabs tests
    ; {[testenv:pyright]commands}
    ; {[testenv:mypy]commands}
    # mypy yabs tests


[testenv:format]
description = Reformat python code using ruff (Black, isort, and pyupgrade)
skip_install = true
deps =
    ruff
changedir = {toxinidir}
commands =
    ruff check --fix yabs tests
    ruff format yabs tests
    {[testenv:lint]commands}


[testenv:pyright]
skip_install = true
deps =
    pyright
changedir = {toxinidir}
commands =
    pyright yabs tests
; ignore_outcome = true


[testenv:mypy]
skip_install = true
deps =
    lxml
    mypy
changedir = {toxinidir}
commands =
    mypy yabs tests --html-report build/mypy
ignore_outcome = true


[testenv:docs]
description = Build Sphinx documentation (output directory: docs/sphinx-build)
changedir = docs
deps =
    furo
    snazzy
    sphinx
    sphinx_rtd_theme
    myst-parser[linkify]
    sphinxcontrib-mermaid
commands =
    # http://www.sphinx-doc.org/en/master/man/sphinx-build.html
    sphinx-build -b html sphinx sphinx-build


